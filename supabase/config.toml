project_id = "campflow"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.register-institution]
verify_jwt = false

[functions.invite-users]
verify_jwt = true

[functions.accept-invitation]
verify_jwt = true

[functions.join-institution]
verify_jwt = true

[functions.review-join-request]
verify_jwt = true

[functions.admin-manage-users]
verify_jwt = true

[functions.activate-institution]
verify_jwt = true

[functions.ai-intake]
verify_jwt = true

[functions.submit-complaint]
verify_jwt = true

[functions.update-complaint]
verify_jwt = true

[functions.retry-email-deliveries]
verify_jwt = true

[functions.gemini-assistant]
verify_jwt = true

[functions.ai-recommendation]
verify_jwt = true

[functions.campus-upgrade]
verify_jwt = true
